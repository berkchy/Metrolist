name: CI Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APKs
        run: ./gradlew --console=plain assembleFossDebug assembleGmsDebug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.ci
          METROLIST_APP_NAME: Metrolist CI
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/foss/debug/*.apk
            app/build/outputs/apk/gms/debug/*.apk
