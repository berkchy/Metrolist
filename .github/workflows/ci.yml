name: CI Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/persistent-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Metrolist CI,O=Metrolist,C=US"

      - name: Build Debug APKs
        run: ./gradlew --console=plain assembleFossDebug assembleGmsDebug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.ci
          METROLIST_APP_NAME: Metrolist CI
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/foss/debug/*.apk
            app/build/outputs/apk/gms/debug/*.apk

  release:
    name: Publish Debug Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download Debug APKs
        uses: actions/download-artifact@v8
        with:
          name: app-debug-${{ github.sha }}
          path: downloaded_artifacts/

      - name: Organize APKs for release
        run: |
          short_sha="${GITHUB_SHA::7}"
          mkdir -p release_files

          FOSS_APK=$(find downloaded_artifacts -name "*foss*.apk" | head -1)
          GMS_APK=$(find downloaded_artifacts -name "*gms*.apk" | head -1)

          if [ -z "$FOSS_APK" ] || [ -z "$GMS_APK" ]; then
            echo "Could not find the foss and gms APKs in the build artifact"
            find downloaded_artifacts -name "*.apk"
            exit 1
          fi

          mv "$FOSS_APK" "release_files/Metrolist-foss-debug-$short_sha.apk"
          mv "$GMS_APK" "release_files/Metrolist-gms-debug-$short_sha.apk"

          ls -la release_files/

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          {
            echo "Debug build of commit $short_sha."
            echo ""
            echo "- Metrolist-foss-debug-$short_sha.apk (FOSS variant)"
            echo "- Metrolist-gms-debug-$short_sha.apk (Google Play services variant)"
          } > release_notes.md

          gh release create "build-$short_sha" \
            --repo "${{ github.repository }}" \
            --title "Debug build $short_sha" \
            --notes-file release_notes.md \
            --latest \
            release_files/*.apk

      - name: Update release summary
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "## Debug Release" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: $short_sha" >> $GITHUB_STEP_SUMMARY
          echo "- **APKs**: $(ls release_files/*.apk | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL**: https://github.com/${{ github.repository }}/releases/tag/build-$short_sha" >> $GITHUB_STEP_SUMMARY
